# Production app configuration.
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration
#
# The URLs below are placeholders: the app has no production deployment yet.
# Replace REPLACE-WITH-PRODUCTION-HOST with the stable production hostname
# (e.g. your-app.vercel.app) before running `shopify app deploy`.
# Never commit ephemeral dev-tunnel (ngrok) URLs here — local development
# uses the untracked shopify.app.dev.toml (`shopify app config use dev`).

client_id = "eb629f7ef2177c6f74d0e0da6b7f2749"
name = "SmartDiscovery AI"
# /chat is the app home: the nav link with rel="home" is hidden from the
# admin sidebar by design, so clicking the app name must open chat directly.
application_url = "https://REPLACE-WITH-PRODUCTION-HOST/chat"
embedded = true

[webhooks]
api_version = "2026-04"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://REPLACE-WITH-PRODUCTION-HOST/api/auth/callback",
  "https://REPLACE-WITH-PRODUCTION-HOST/api/auth/online/callback"
]

[app_proxy]
url = "https://REPLACE-WITH-PRODUCTION-HOST/api/proxy"
subpath = "smartdiscovery"
prefix = "apps"
